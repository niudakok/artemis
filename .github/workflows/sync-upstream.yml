# 定期将 google/artemis 的更新合并回本仓库的 main。
#
# 本仓库是 google/artemis 的镜像，并额外维护一个仅含本文件的提交，
# 因此这里使用普通 merge 而非 --ff-only：main 含有上游没有的提交，
# 快进合并永远不可能成功。
#
# 安全约束：
#   - 永不使用 force push
#   - 合并冲突时中止并开 issue，绝不把冲突状态推上去
#   - 每次运行串行执行（concurrency），避免并发推送
name: Sync Upstream

on:
  schedule:
    # 每 6 小时一次，避开整点以分散 GitHub Actions 的调度高峰
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge google/artemis into main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # 定时任务运行在默认分支（i18n/zh-cn）上，必须显式检出 main，
          # 否则会把本地化分支的内容推到 main。
          ref: main
          fetch-depth: 0
          # 保留默认凭据（GITHUB_TOKEN），否则 git push 没有认证信息。
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git fetch https://github.com/google/artemis.git \
            main:refs/remotes/upstream/main

      - name: Detect whether upstream advanced
        id: detect
        run: |
          # main 含有上游没有的提交（如本文件），不能用 rev 相等判断；
          # 正确条件是 upstream/main 是否已是 HEAD 的祖先。
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already contains upstream/main, nothing to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "upstream/main is $(git rev-list --count HEAD..upstream/main) commit(s) ahead."
            git log --oneline HEAD..upstream/main | head -20
          fi

      - name: Merge upstream into main
        id: merge
        if: steps.detect.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git merge --no-edit --no-ff upstream/main -m "chore(sync): 合并 google/artemis 上游更新 [skip ci]"

      - name: Push merged main
        id: push
        if: steps.detect.outputs.changed == 'true' && steps.merge.outcome == 'success'
        continue-on-error: true
        run: |
          git push origin HEAD:main

      - name: Report push failure
        if: steps.push.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ 上游合并后推送失败 / Push after upstream merge failed"
            echo
            echo "合并已在 runner 内完成，但推送到 origin/main 被拒绝。最常见的原因："
            echo "本次上游更新包含 \`.github/workflows/\` 下的文件变更，而内置 GITHUB_TOKEN 没有 \`workflows\` 权限。"
            echo
            echo "The merge completed on the runner, but pushing to origin/main was rejected. The most common cause:"
            echo "this upstream update touches files under \`.github/workflows/\`, and the built-in GITHUB_TOKEN lacks the \`workflows\` permission."
            echo
            echo "处理方式 / How to fix:"
            echo "1. 本地执行 \`git fetch upstream && git checkout main && git merge upstream/main && git push origin main\`"
            echo "2. 或配置带 workflow 权限的 PAT 供本工作流使用"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Report merge conflict
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '[upstream-sync]';
            // 用标题标记去重，不依赖 label —— 标签不存在会让 issues.create 返回 422。
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            if (existing.some(i => i.title.includes(marker))) {
              core.info('已有未关闭的上游同步冲突 issue，跳过新建。');
              return;
            }
            const conflicts = await github.exec.getExecOutput({
              cmd: 'git diff --name-only --diff-filter=U',
              cwd: process.env.GITHUB_WORKSPACE,
            });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${marker} 上游同步冲突，需要人工处理`,
              body: [
                '自动同步 google/artemis 时发生合并冲突，未做任何推送。',
                '',
                '冲突文件：',
                '```',
                conflicts.stdout.trim() || '(无法枚举)',
                '```',
                '',
                '处理方式：',
                '1. 本地 `git fetch upstream && git checkout main`',
                '2. `git merge upstream/main` 手动解决冲突',
                '3. 若汉化分支需要跟进：`git checkout i18n/zh-cn && git rebase main`',
                '',
                '关闭本 issue 后可重新手动触发本 workflow。',
              ].join('\n'),
            });
